<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Restofy nedir? QR okut, sipariş ver, mutfak hazırlasın, garson servis etsin, ödeme tamamlansın">
<style>text{font-family:"Segoe UI",-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#1b2038"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffa63d"/><stop offset="1" stop-color="#f0460a"/></linearGradient>
<linearGradient id="accv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa63d"/><stop offset="1" stop-color="#f0460a"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffa63d" stop-opacity="0.35"/><stop offset="1" stop-color="#ffa63d" stop-opacity="0"/></radialGradient>
<clipPath id="page"><rect width="1000" height="300" rx="24"/></clipPath>
</defs>
<g clip-path="url(#page)">
<rect width="1000" height="300" fill="url(#bg)"/>
<circle cx="960" cy="30" r="220" fill="url(#glow)"><animate attributeName="r" values="200;250;200" dur="7s" repeatCount="indefinite"/></circle>
<rect y="0" width="300" height="300" fill="url(#sweep)"><animate attributeName="x" values="-300;1000" dur="7s" repeatCount="indefinite"/></rect>
<text x="500" y="60" font-size="32" font-weight="800" fill="url(#acc)" text-anchor="middle">Masadan ödemeye tek akış</text>
<text x="500" y="88" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="middle" >Restofy’nin hedeflediği restoran akışı</text>
<line x1="142" y1="160" x2="254" y2="160" stroke="#ffa63d" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 9"><animate attributeName="stroke-dashoffset" from="0" to="-12" dur="1.1s" repeatCount="indefinite"/></line>
<polygon points="257,160 247,154 247,166" fill="#ffa63d"/>
<line x1="342" y1="160" x2="454" y2="160" stroke="#ffa63d" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 9"><animate attributeName="stroke-dashoffset" from="0" to="-12" dur="1.1s" repeatCount="indefinite"/></line>
<polygon points="457,160 447,154 447,166" fill="#ffa63d"/>
<line x1="542" y1="160" x2="654" y2="160" stroke="#ffa63d" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 9"><animate attributeName="stroke-dashoffset" from="0" to="-12" dur="1.1s" repeatCount="indefinite"/></line>
<polygon points="657,160 647,154 647,166" fill="#ffa63d"/>
<line x1="742" y1="160" x2="854" y2="160" stroke="#ffa63d" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 9"><animate attributeName="stroke-dashoffset" from="0" to="-12" dur="1.1s" repeatCount="indefinite"/></line>
<polygon points="857,160 847,154 847,166" fill="#ffa63d"/>
<circle cx="100" cy="160" r="42" fill="none" stroke="#ffa63d" stroke-width="3" opacity="0"><animate attributeName="opacity" keyTimes="0;0.12;1" values="0.9;0;0" dur="8s" repeatCount="indefinite"/></circle><circle cx="100" cy="160" r="34" fill="#141a2e" stroke="url(#acc)" stroke-width="3"/>
<text x="100" y="169" font-size="26" font-weight="800" fill="#f8fafc" text-anchor="middle" >1</text>
<text x="100" y="230" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle" >QR</text>
<text x="100" y="253" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle" >Masadaki QR okutulur</text>
<circle cx="300" cy="160" r="42" fill="none" stroke="#ffa63d" stroke-width="3" opacity="0"><animate attributeName="opacity" keyTimes="0;0.2499;0.2500;0.3700;1" values="0;0;0.9;0;0" dur="8s" repeatCount="indefinite"/></circle><circle cx="300" cy="160" r="34" fill="#141a2e" stroke="url(#acc)" stroke-width="3"/>
<text x="300" y="169" font-size="26" font-weight="800" fill="#f8fafc" text-anchor="middle" >2</text>
<text x="300" y="230" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle" >Sipariş</text>
<text x="300" y="253" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle" >Menü ve sipariş</text>
<circle cx="500" cy="160" r="42" fill="none" stroke="#ffa63d" stroke-width="3" opacity="0"><animate attributeName="opacity" keyTimes="0;0.4999;0.5000;0.6200;1" values="0;0;0.9;0;0" dur="8s" repeatCount="indefinite"/></circle><circle cx="500" cy="160" r="34" fill="#141a2e" stroke="url(#acc)" stroke-width="3"/>
<text x="500" y="169" font-size="26" font-weight="800" fill="#f8fafc" text-anchor="middle" >3</text>
<text x="500" y="230" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle" >Mutfak</text>
<text x="500" y="253" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle" >Hazırlık takibi</text>
<circle cx="700" cy="160" r="42" fill="none" stroke="#ffa63d" stroke-width="3" opacity="0"><animate attributeName="opacity" keyTimes="0;0.7499;0.7500;0.8700;1" values="0;0;0.9;0;0" dur="8s" repeatCount="indefinite"/></circle><circle cx="700" cy="160" r="34" fill="#141a2e" stroke="url(#acc)" stroke-width="3"/>
<text x="700" y="169" font-size="26" font-weight="800" fill="#f8fafc" text-anchor="middle" >4</text>
<text x="700" y="230" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle" >Servis</text>
<text x="700" y="253" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle" >Garson operasyonu</text>
<circle cx="900" cy="160" r="42" fill="none" stroke="#ffa63d" stroke-width="3" opacity="0"><animate attributeName="opacity" keyTimes="0;0.88;1" values="0;0;0.9" dur="8s" repeatCount="indefinite"/></circle><circle cx="900" cy="160" r="34" fill="#141a2e" stroke="url(#acc)" stroke-width="3"/>
<text x="900" y="169" font-size="26" font-weight="800" fill="#f8fafc" text-anchor="middle" >5</text>
<text x="900" y="230" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle" >Ödeme</text>
<text x="900" y="253" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle" >Ödeme tamamlanır</text>
<g><circle r="11.0" fill="#fff" fill-opacity="0.25"/><circle r="5" fill="#fff"/><animateMotion dur="8s" begin="0s" repeatCount="indefinite" path="M100 160 L900 160"/></g>
</g>
</svg>
