name: Auth integration quality

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [feature/auth-service, dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Verify Docker availability
        run: docker info
      - name: Verify Auth, Mail, Gateway and shared test support
        run: mvn -B -ntp -f backend/pom.xml -pl services/api-gateway,services/auth-service,services/mail-service -am clean verify
      - name: Check executed tests, architecture rule and coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for module in ('libs/test-support', 'services/api-gateway', 'services/auth-service', 'services/mail-service'):
              target = Path('backend') / module / 'target'
              reports = list((target / 'surefire-reports').glob('TEST-*.xml'))
              assert reports, f'JUnit reports missing: {module}'
              suites = [ET.parse(report).getroot() for report in reports]
              assert sum(int(suite.get('tests', 0)) for suite in suites) > 0, module
              for suite in suites:
                  assert all(int(suite.get(key, 0)) == 0 for key in ('failures', 'errors', 'skipped')), suite.get('name')
          target = Path('backend/services/auth-service/target')
          reports = list((target / 'surefire-reports').glob('TEST-*.xml'))
          assert reports, 'Auth JUnit reports are missing'
          suites = [ET.parse(report).getroot() for report in reports]
          assert sum(int(suite.get('tests', 0)) for suite in suites) > 0, 'No Auth tests executed'
          for suite in suites:
              assert all(int(suite.get(key, 0)) == 0 for key in ('failures', 'errors', 'skipped')), suite.get('name')
          architecture = [suite for suite in suites if suite.get('name', '').endswith('.ArchitectureRulesTests')]
          assert architecture and int(architecture[0].get('tests', 0)) > 0, 'Architecture rule did not execute'
          line = ET.parse(target / 'site/jacoco/jacoco.xml').getroot().find("counter[@type='LINE']")
          assert line is not None, 'Line coverage is missing'
          covered, missed = int(line.get('covered')), int(line.get('missed'))
          assert covered + missed > 0 and covered / (covered + missed) >= 0.80, 'Auth line coverage below 80%'
          PY
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auth-quality-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            backend/libs/test-support/target/surefire-reports/
            backend/services/api-gateway/target/surefire-reports/
            backend/services/mail-service/target/surefire-reports/
            backend/services/mail-service/target/site/jacoco/
            backend/services/auth-service/target/surefire-reports/
            backend/services/auth-service/target/site/jacoco/
            backend/services/auth-service/target/checkstyle-result.xml
            backend/services/auth-service/target/pmd.xml
            backend/services/auth-service/target/site/pmd.html
            backend/services/auth-service/target/reports/pmd.html
