# ==========================================
# RESTOFY - kitchen-service
# ==========================================

# APPLICATION
spring.application.name=kitchen-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}
logging.pattern.correlation=[%X{correlationId:-}]

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${DB_KITCHEN_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# STAFF AUTHENTICATION (Auth Service contract). These reuse shared ENV keys; no value here is a secret.
# KITCHEN_AUTH_STAFF_PUBLIC_KEY: Base64 X.509 RSA public key of Auth's staff JWTs. Blank keeps staff authentication
# off (every staff request is 401). When it is set, AUTH_SERVICE_URL must be an HTTPS origin.
restofy.auth.service-url=${AUTH_SERVICE_URL:}
restofy.auth.staff-public-key=${KITCHEN_AUTH_STAFF_PUBLIC_KEY:}
restofy.auth.issuer=${JWT_ISSUER:restofy-auth}
restofy.auth.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:300}
restofy.auth.allowed-origins=${CORS_ALLOWED_ORIGINS:}
restofy.auth.connect-timeout-ms=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}
restofy.auth.read-timeout-ms=${REST_CLIENT_READ_TIMEOUT_MS:5000}
