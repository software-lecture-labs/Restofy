# ==========================================
# RESTOFY - auth-service
# ==========================================

# APPLICATION
spring.application.name=auth-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${DB_AUTH_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# AUTH-01: explicit opt-in; no default credentials.
auth.bootstrap.environment=${APP_ENV:}
auth.bootstrap.dev-users.enabled=${AUTH_DEV_USERS_ENABLED:false}
auth.bootstrap.dev-users.admin.email=${AUTH_DEV_ADMIN_EMAIL:}
auth.bootstrap.dev-users.admin.password=${AUTH_DEV_ADMIN_PASSWORD:}
auth.bootstrap.dev-users.waiter.email=${AUTH_DEV_WAITER_EMAIL:}
auth.bootstrap.dev-users.waiter.password=${AUTH_DEV_WAITER_PASSWORD:}
auth.bootstrap.dev-users.kitchen.email=${AUTH_DEV_KITCHEN_EMAIL:}
auth.bootstrap.dev-users.kitchen.password=${AUTH_DEV_KITCHEN_PASSWORD:}
auth.bootstrap.initial-admin.enabled=${AUTH_INITIAL_ADMIN_ENABLED:false}
auth.bootstrap.initial-admin.email=${AUTH_INITIAL_ADMIN_EMAIL:}
auth.bootstrap.initial-admin.password=${AUTH_INITIAL_ADMIN_PASSWORD:}

auth.session.restaurant-id=${AUTH_RESTAURANT_ID}
auth.session.private-key=${AUTH_JWT_PRIVATE_KEY}
auth.session.csrf-secret=${AUTH_CSRF_SECRET}
auth.session.cookie-secure=${AUTH_COOKIE_SECURE}
auth.session.issuer=${JWT_ISSUER}
auth.session.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS}
auth.session.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS}
auth.session.allowed-origins=${CORS_ALLOWED_ORIGINS}
auth.mfa.encryption-key=${AUTH_MFA_ENCRYPTION_KEY}
