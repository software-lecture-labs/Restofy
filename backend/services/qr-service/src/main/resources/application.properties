# ==========================================
# RESTOFY - qr-service
# ==========================================

# APPLICATION
spring.application.name=qr-service
qr.q5.restaurant-id=${AUTH_RESTAURANT_ID}
qr.q5.auth-public-key=${AUTH_Q5_COMMAND_PUBLIC_KEY}
qr.q5.receipt-private-key=${QR_Q5_RECEIPT_PRIVATE_KEY}
qr.q5.receipt-public-key=${AUTH_Q5_QR_PUBLIC_KEY}
qr.q5.staff-public-key=${MAIL_AUTH_PUBLIC_KEY}
qr.q5.staff-issuer=${JWT_ISSUER}
qr.q5.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS}
qr.q5.allowed-origins=${CORS_ALLOWED_ORIGINS}
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,staffRevocation

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${DB_QR_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Reject mass-assignment fields such as restaurantId, role and operationalStatus.
spring.jackson.deserialization.fail-on-unknown-properties=true

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Required in every runtime environment; never use a fallback encryption key.
qr.payload.encryption-key=${QR_PAYLOAD_ENCRYPTION_KEY}

# Empty disables image rendering with 503; configured URLs are validated at startup.
qr.public-entry-url=${QR_PUBLIC_ENTRY_URL:}

# RATE LIMITS (ADR-QR-002 K7)
# QR_TRUSTED_PROXY_CIDRS: the API Gateway as QR sees it; X-Forwarded-For is read only from these peers.
# Blank ignores the header and turns the per-address limits off (behind the Gateway every client would share one).
qr.proxy.trusted-cidrs=${QR_TRUSTED_PROXY_CIDRS:}
# Plain properties, not ENV keys: counter table size bound and the dedicated counter pool.
qr.rate-limit.max-buckets=10000
qr.rate-limit.pool-size=5

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ORDER CART-ACTIVITY RECEIPTS (plain property, not an ENV key): how long a receipt is kept to recognise a redelivered
# Order event (minimum 7 days). Keep it longer than the delivered-outbox retention of Order (30 days).
qr.cart-receipt-retention=P90D
