# ==========================================
# RESTOFY - waiter-service
# ==========================================

# APPLICATION
spring.application.name=waiter-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${DB_WAITER_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# SERVICE-TO-SERVICE HTTP
restofy.rest-client.connect-timeout-ms=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}
restofy.rest-client.read-timeout-ms=${REST_CLIENT_READ_TIMEOUT_MS:5000}
restofy.services.qr-url=${QR_SERVICE_URL}
restofy.services.order-url=${ORDER_SERVICE_URL}
