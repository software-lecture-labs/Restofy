# ==========================================
# RESTOFY - mail-service
# ==========================================

# APPLICATION
spring.application.name=mail-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${DB_MAIL_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

restofy.mail.public-key=${MAIL_AUTH_PUBLIC_KEY}
restofy.mail.issuer=${JWT_ISSUER}
restofy.mail.from=${MAIL_FROM_ADDRESS}
restofy.mail.tls-mode=${MAIL_SMTP_TLS_MODE}
restofy.mail.connectiontimeout=${MAIL_SMTP_CONNECT_TIMEOUT_MS:3000}
restofy.mail.timeout=${MAIL_SMTP_READ_TIMEOUT_MS:5000}
restofy.mail.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT_MS:5000}
spring.mail.host=${MAIL_SMTP_HOST}
spring.mail.port=${MAIL_SMTP_PORT}
spring.mail.username=${MAIL_SMTP_USERNAME:}
spring.mail.password=${MAIL_SMTP_PASSWORD:}

restofy.mail.payload-key=${MAIL_PAYLOAD_ENCRYPTION_KEY}
