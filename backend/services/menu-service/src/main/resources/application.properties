# ==========================================
# RESTOFY - menu-service
# ==========================================

# APPLICATION
spring.application.name=menu-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${DB_MENU_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# PRODUCT IMAGES (references only: the service never fetches, proxies or stores an image)
# Comma-separated exact HTTPS origins an image URL may point to, for example https://host or https://host:8443.
# Empty (the default) means NO image URL can be set, only cleared. Invalid entries stop the application at startup.
restofy.menu.image.allowed-origins=${MENU_IMAGE_ALLOWED_ORIGINS:}

# RATE LIMITING (counted in this service's own PostgreSQL, so the limits hold across instances)
# Fixed windows on the database clock. Proposed defaults, pending the team's approval: they are properties, not environment
# variables, and there is no "off" switch and no default in code: a missing or out-of-range value stops the application.
# Spring's relaxed binding lets an operator override one, for example RESTOFY_MENU_RATELIMIT_ADMINWRITE_MAXREQUESTS.
#
# Customer menu: per verified restaurant (all its customers together); requests nobody could verify share one small
# budget per connection peer (behind the Gateway that peer is the Gateway: forwarding headers are NOT trusted).
restofy.menu.rate-limit.public-restaurant.max-requests=600
restofy.menu.rate-limit.public-restaurant.window-seconds=60
restofy.menu.rate-limit.public-unverified.max-requests=30
restofy.menu.rate-limit.public-unverified.window-seconds=60
# Management: per verified user and per restaurant, reads and writes apart; no verified user: small peer budget.
restofy.menu.rate-limit.admin-read.max-requests=120
restofy.menu.rate-limit.admin-read.window-seconds=60
restofy.menu.rate-limit.admin-write.max-requests=30
restofy.menu.rate-limit.admin-write.window-seconds=60
restofy.menu.rate-limit.admin-restaurant-read.max-requests=600
restofy.menu.rate-limit.admin-restaurant-read.window-seconds=60
restofy.menu.rate-limit.admin-restaurant-write.max-requests=150
restofy.menu.rate-limit.admin-restaurant-write.window-seconds=60
restofy.menu.rate-limit.admin-unverified.max-requests=20
restofy.menu.rate-limit.admin-unverified.window-seconds=60
# Other services calling Menu for one verified restaurant (no HTTP endpoint uses this yet, D-09).
restofy.menu.rate-limit.internal-restaurant.max-requests=600
restofy.menu.rate-limit.internal-restaurant.window-seconds=60
# Retry-After of the 503 sent when a request cannot be counted (the request is refused, never let through).
restofy.menu.rate-limit.fail-closed-retry-after-seconds=5
