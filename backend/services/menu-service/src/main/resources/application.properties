# ==========================================
# RESTOFY - menu-service
# ==========================================

# APPLICATION
spring.application.name=menu-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${DB_MENU_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# PRODUCT IMAGES (references only: the service never fetches, proxies or stores an image)
# Comma-separated exact HTTPS origins an image URL may point to, for example https://host or https://host:8443.
# Empty (the default) means NO image URL can be set, only cleared. Invalid entries stop the application at startup.
restofy.menu.image.allowed-origins=${MENU_IMAGE_ALLOWED_ORIGINS:}

# STAFF AUTHENTICATION (Auth's HttpOnly restofy_access cookie, proved locally; no value here is a secret)
# MENU_AUTH_STAFF_PUBLIC_KEY: Base64 X.509 RSA public key matching Auth's AUTH_JWT_PRIVATE_KEY (at least 2048 bits).
#   Blank (the default) keeps staff authentication OFF: every management request is a 401. JWT_ISSUER must match Auth.
# CORS_ALLOWED_ORIGINS: exact browser Origin allowlist of the mutation (CSRF/Origin) check; blank refuses every mutation.
restofy.menu.auth.staff-public-key=${MENU_AUTH_STAFF_PUBLIC_KEY:}
restofy.menu.auth.issuer=${JWT_ISSUER:restofy-auth}
restofy.menu.auth.allowed-origins=${CORS_ALLOWED_ORIGINS:}
