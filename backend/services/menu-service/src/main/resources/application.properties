# ==========================================
# RESTOFY - menu-service
# ==========================================

# APPLICATION
spring.application.name=menu-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${DB_MENU_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# PRODUCT IMAGES (references only: the service never fetches, proxies or stores an image)
# Comma-separated exact HTTPS origins an image URL may point to, for example https://host or https://host:8443.
# Empty (the default) means NO image URL can be set, only cleared. Invalid entries stop the application at startup.
restofy.menu.image.allowed-origins=${MENU_IMAGE_ALLOWED_ORIGINS:}

# QR GUEST SESSION CHECK (the public menu learns its restaurant from QR, ADR-MENU-008)
# Menu signs its own request to QR with its OWN private key; QR is given the matching PUBLIC key (QR_MENU_CALLER_PUBLIC_KEYS).
# Empty private key (the default) means the connection is OFF: nothing is verified and every public menu request is a 404.
# Set, then everything must be valid or the application stops at startup (the message names the setting, never a value).
restofy.menu.qr.service-url=${QR_SERVICE_URL:}
restofy.menu.qr.caller-key-id=${MENU_QR_CALLER_KEY_ID:}
restofy.menu.qr.caller-private-key=${MENU_QR_CALLER_PRIVATE_KEY:}
restofy.menu.qr.connect-timeout-ms=2000
restofy.menu.qr.read-timeout-ms=3000
