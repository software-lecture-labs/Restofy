# Only loaded by Maven's test profile (spring.profiles.active=test). The existing suites send thousands of requests for
# one test restaurant within a minute, so the shared limits are lifted here; the rate-limit tests set their own small
# limits and the shipped defaults are checked separately (RateLimitSettingsTests). This is not a production setting.
restofy.menu.rate-limit.public-restaurant.max-requests=1000000
restofy.menu.rate-limit.public-unverified.max-requests=1000000
restofy.menu.rate-limit.admin-read.max-requests=1000000
restofy.menu.rate-limit.admin-write.max-requests=1000000
restofy.menu.rate-limit.admin-restaurant-read.max-requests=1000000
restofy.menu.rate-limit.admin-restaurant-write.max-requests=1000000
restofy.menu.rate-limit.admin-unverified.max-requests=1000000
restofy.menu.rate-limit.internal-restaurant.max-requests=1000000
