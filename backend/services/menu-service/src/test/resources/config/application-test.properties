# Test-only (src/test, never packaged). Every distinct test configuration keeps its own cached Spring context and so its own
# Hikari pool, all against ONE shared PostgreSQL (default max_connections 100), and the restart tests start one more context.
# With the default pool (10 idle connections each) the number of live connections depended on the class order of the run and
# approached the limit; an unlucky order exhausted it ("sorry, too many clients already"). One idle connection per pool, and
# surplus ones released after 10 s (Hikari's minimum), keeps the total far below the limit. The maximum stays at the default
# 10, which the concurrency tests (at most 8 threads) need.
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
