# ==========================================
# RESTOFY - order-service
# ==========================================

# APPLICATION
spring.application.name=order-service
server.port=${BACKEND_INTERNAL_PORT:8080}

# LOGGING
logging.level.root=${LOG_LEVEL:INFO}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${DB_ORDER_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# SERVICE-TO-SERVICE HTTP
restofy.rest-client.connect-timeout-ms=${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}
restofy.rest-client.read-timeout-ms=${REST_CLIENT_READ_TIMEOUT_MS:5000}

# CART LIMITS (plain properties, not ENV keys)
restofy.cart.max-item-quantity=50
restofy.cart.max-lines=50

# JSON: strict binding. Unknown fields (e.g. client-sent prices or ids), fractional numbers for integers and
# strings for numbers are rejected with 400 instead of being silently coerced.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

# LOG CORRELATION
logging.pattern.level=%5p [%X{correlationId:-}]

# IDEMPOTENCY / HOUSEKEEPING (plain properties, not ENV keys). Retention only bounds how long an exact retry is
# answered; it never lets a consumed cart be ordered again (the database guarantees that).
restofy.idempotency.cart-item-retention=PT24H
restofy.idempotency.checkout-retention=PT72H
restofy.idempotency.cancellation-retention=PT72H
restofy.idempotency.cleanup-interval=PT1H
restofy.idempotency.cleanup-initial-delay=PT5M
restofy.idempotency.cleanup-batch-size=500
restofy.idempotency.expired-cart-retention=P30D
